services:
  - type: web
    name: fetal-brain-mri-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.11
      - key: CORS_ORIGINS
        value: https://fetal-brain-abnormalities-checker.netlify.app,http://localhost:5173,http://localhost:5174,http://localhost:3000
