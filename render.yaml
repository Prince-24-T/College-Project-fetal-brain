services:
  - type: web
    name: fetal-brain-mri-backend
    runtime: python
    rootDir: .
    buildCommand: pip install -r backend/requirements.txt
    startCommand: gunicorn --workers 1 --timeout 180 backend.app:app
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.13
      - key: CORS_ORIGINS
        value: "*"
      - key: TF_CPP_MIN_LOG_LEVEL
        value: "2"
